name: Release

# Builds the Windows installer and a portable exe, and publishes them as a GitHub release.
# Start it by pushing a tag like v0.1.0, or run it by hand (Actions → Release → Run workflow)
# with the tag to create. The tag must match the version in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release, e.g. v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG doesn't match the app version $version in src-tauri/tauri.conf.json"
          }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p loadout-core
      - name: Build the installer and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Loadout ${{ env.TAG }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Switch GTA V and FiveM graphics, in-game settings and sound packs in one click, then join your server. Keep an "Arena – Max FPS" setup for PvP, a "City RP – Ultra" setup for roleplay, and anything in between.

            ## Download

            - **`Loadout_…_x64-setup.exe`**: the installer (recommended). It installs for your Windows user only, with no admin rights needed.
            - **`Loadout_…_x64-portable.exe`**: a single exe with nothing to install. Keep it anywhere.

            Windows will probably show a SmartScreen warning because the app isn't code-signed yet. Click **More info → Run anyway**.

            ## What it does

            - **Profiles**: graphics and display settings (Max FPS, Balanced, High and Ultra presets, or any setting tweaked), GTA's in-game settings (FOV, brightness, HUD, volumes) and a set of packs, all applied together.
            - **Quick Play**: save a server once with its profile. Play applies the profile, then FiveM joins the server.
            - **Pack library**: import sound packs, citizen packs, ReShade presets and `.rpf` mods from a folder, `.zip` or `.rpf`. Executables and script hooks are refused.
            - **Safe switching**: every file is backed up first. A failed or interrupted apply puts every file back, and **Restore vanilla** returns the game files to how they were.
            - **Notices changes**: settings you changed in-game (offers to save them into the profile) and pack files replaced by a FiveM update (offers to re-apply).

            ## Good to know

            - Close FiveM before switching. Loadout waits for it, or closes it if you ask.
            - If GTA V is installed under Program Files, run Loadout as administrator to install sound packs into the game folder.
            - Packs in the GTA V folder also affect Story Mode and GTA Online, so restore vanilla before playing Online.
            - Servers using Pure Mode may refuse modified files.

            ## Known limitations

            - This is the first release and it hasn't been tested on a real PC with FiveM yet. Please open an issue if something goes wrong.
            - The frame scaling and aspect ratio values are marked "verify" in the editor until they're confirmed in-game.
            - FiveM for GTA V Enhanced isn't supported yet.
      - name: Attach the portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $portable = "Loadout_${version}_x64-portable.exe"
          Copy-Item target/release/loadout.exe $portable
          gh release upload $env:TAG $portable --clobber --repo $env:GITHUB_REPOSITORY
